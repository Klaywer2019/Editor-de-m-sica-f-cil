<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistador Studio | AI Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Navbar */
        .navbar {
            background-color: #161b22;
            border-bottom: 2px solid #00a2ff;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            z-index: 100;
        }

        .nav-item {
            color: #8b949e;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-item.active { color: #00a2ff; }

        /* Conteúdo Principal */
        .content { flex: 1; position: relative; display: flex; flex-direction: column; }

        .tab-content { 
            display: none; 
            width: 100%; 
            height: 100%;
            padding: 20px;
            flex-direction: column;
        }
        .tab-content.active { display: flex; }

        /* CHAT IA ESTILO MODERNO */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 80px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg.ia {
            background: #161b22;
            color: #c9d1d9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #30363d;
        }

        .msg.user {
            background: #00a2ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Input de Chat */
        .chat-input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: #0d1117;
            display: flex;
            gap: 10px;
            border-top: 1px solid #30363d;
        }

        .chat-input-area input {
            flex: 1;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 25px;
            padding: 12px 20px;
            color: white;
            outline: none;
        }

        .btn-send {
            background: #00a2ff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Estilos das outras abas */
        textarea {
            width: 100%; height: 60%; background: #161b22; border: 1px solid #30363d;
            border-radius: 12px; color: white; padding: 15px; font-size: 1rem; resize: none;
        }

        .btn-blue {
            background: #00a2ff; color: white; border: none; padding: 15px;
            border-radius: 8px; margin-top: 15px; font-weight: bold; width: 100%;
        }

        /* Toasts e Modais */
        #custom-toast {
            display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #00a2ff; color: white; padding: 12px 25px; border-radius: 50px;
            font-weight: bold; z-index: 2000;
        }
    </style>
</head>
<body>

    <div id="custom-toast"></div>

    <nav class="navbar">
        <div class="nav-item" id="nav-compor" onclick="openTab('compor')">
            <span>📝</span><span>Compor</span>
        </div>
        <div class="nav-item" id="nav-biblioteca" onclick="openTab('biblioteca')">
            <span>📂</span><span>Músicas</span>
        </div>
        <div class="nav-item active" id="nav-ia" onclick="openTab('ia')">
            <span>⚡</span><span>Produção IA</span>
        </div>
    </nav>

    <div class="content">
        <div id="compor" class="tab-content">
            <h1 style="text-align: center; margin-bottom: 15px;">Novo Hit</h1>
            <textarea id="texto-letra" placeholder="Escreva sua letra aqui..."></textarea>
            <button class="btn-blue" onclick="salvarNaBiblioteca()">SALVAR NA BIBLIOTECA</button>
        </div>

        <div id="biblioteca" class="tab-content">
            <h1 style="text-align: center; margin-bottom: 15px;">Minhas Pastas</h1>
            <div id="lista-musicas"></div>
        </div>

        <div id="ia" class="tab-content active">
            <div id="chat-container">
                <div class="msg ia">Salve! Sou sua IA de produção. Qual é a vibe do hit de hoje? Manda sua ideia ou letra! 🚀</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Diga algo para a IA..." onkeypress="checkEnter(event)">
                <button class="btn-send" onclick="enviarMensagem()">➔</button>
            </div>
        </div>
    </div>

    <script>
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        function checkEnter(e) { if(e.key === 'Enter') enviarMensagem(); }

        function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            if(!input.value.trim()) return;

            // Mensagem do Usuário
            const userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.innerText = input.value;
            container.appendChild(userMsg);

            const textoUser = input.value;
            input.value = "";
            container.scrollTop = container.scrollHeight;

            // Resposta Automática da IA (Simulada)
            setTimeout(() => {
                const iaMsg = document.createElement('div');
                iaMsg.className = 'msg ia';
                iaMsg.innerText = "Pesado demais! 🔥 Para essa vibe '" + textoUser + "', você quer algo mais focado no grave ou uma melodia mais suave?";
                container.appendChild(iaMsg);
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }

        function mostrarToast(msg) {
            const toast = document.getElementById('custom-toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        // ... (resto das funções de salvar/biblioteca que já tínhamos)
    </script>
</body>
</html>
