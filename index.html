<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistador Studio | Top Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Menu Superior (Navbar) */
        .navbar {
            background-color: #161b22;
            border-bottom: 2px solid #00a2ff;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-item {
            color: #8b949e;
            font-size: 0.9rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-item:hover, .nav-item.active {
            color: #00a2ff;
        }

        /* Área de Conteúdo */
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .tab-content.active {
            display: block;
        }

        /* Estilo da área de composição */
        h1 { font-size: 1.5rem; margin-bottom: 15px; text-align: center; }

        textarea {
            width: 100%;
            height: 350px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            color: white;
            padding: 15px;
            font-size: 1rem;
            resize: none;
            outline: none;
        }

        textarea:focus { border-color: #00a2ff; }

        button {
            background: #00a2ff;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
        }

        button:active { transform: scale(0.98); }

        /* Lista de Músicas */
        .music-card {
            background: #1c2128;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #00a2ff;
        }

        .empty-msg { color: #8b949e; text-align: center; margin-top: 20px; }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-item active" id="nav-compor" onclick="openTab('compor')">
            <span>📝</span>
            <span>Compor</span>
        </div>
        <div class="nav-item" id="nav-biblioteca" onclick="openTab('biblioteca')">
            <span>📂</span>
            <span>Músicas</span>
        </div>
        <div class="nav-item" id="nav-ia" onclick="openTab('ia')">
            <span>⚡</span>
            <span>Produção IA</span>
        </div>
    </nav>

    <div class="content">
        
        <div id="compor" class="tab-content active">
            <h1>Novo Hit</h1>
            <textarea id="texto-letra" placeholder="Escreva sua letra aqui..."></textarea>
            <button onclick="salvarNaBiblioteca()">SALVAR NA BIBLIOTECA</button>
        </div>

        <div id="biblioteca" class="tab-content">
            <h1>Minhas Pastas</h1>
            <div id="lista-musicas">
                </div>
        </div>

        <div id="ia" class="tab-content">
            <h1>Criação com IA</h1>
            <div style="text-align: center; margin-top: 20px;">
                <p style="color: #8b949e;">A IA vai ler sua letra e criar a trilha sonora perfeita.</p>
                <button onclick="alert('IA Analisando Vibe...')">GERAR COM IA</button>
            </div>
        </div>

    </div>

    <script>
        // Função para trocar de aba
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');

            if(tabId === 'biblioteca') {
                renderizarBiblioteca();
            }
        }

        // Função para salvar no LocalStorage
        function salvarNaBiblioteca() {
            const campoTexto = document.getElementById('texto-letra');
            const letra = campoTexto.value;

            if (letra.trim() === "") {
                alert("Escreve alguma coisa antes de salvar, mano!");
                return;
            }

            // Pega a primeira linha como título
            const titulo = letra.split('\n')[0].substring(0, 20) || "Sem título";
            const data = new Date().toLocaleDateString('pt-BR');

            const novaMusica = { titulo, letra, data };

            // Busca músicas já salvas
            let musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];
            musicas.unshift(novaMusica); // Adiciona no início da lista

            // Salva de volta
            localStorage.setItem('conquistador_musicas', JSON.stringify(musicas));

            alert("Música salva com sucesso! 🔥");
            campoTexto.value = ""; // Limpa para a próxima
        }

        // Função para mostrar as músicas na tela
        function renderizarBiblioteca() {
            const container = document.getElementById('lista-musicas');
            const musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];

            container.innerHTML = "";

            if (musicas.length === 0) {
                container.innerHTML = '<p class="empty-msg">Sua biblioteca está vazia. Vá em "Compor"!</p>';
                return;
            }

            musicas.forEach(m => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `<span>${m.titulo}</span> <small>${m.data}</small>`;
                container.appendChild(card);
            });
        }

        // Carrega a biblioteca ao iniciar caso já esteja nela
        renderizarBiblioteca();
    </script>

</body>
</html>
