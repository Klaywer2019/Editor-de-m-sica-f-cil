<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistador Studio | Keime Producer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .navbar { background-color: #161b22; border-bottom: 2px solid #00a2ff; display: flex; justify-content: space-around; padding: 15px 0; z-index: 100; }
        .nav-item { color: #8b949e; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item.active { color: #00a2ff; }
        .content { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .tab-content { display: none; width: 100%; height: 100%; padding: 20px; flex-direction: column; overflow-y: auto; }
        .tab-content.active { display: flex; }
        h1 { font-size: 1.5rem; margin-bottom: 15px; text-align: center; }
        textarea#texto-letra { width: 100%; height: 300px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; color: white; padding: 15px; font-size: 1rem; resize: none; outline: none; }
        .btn-blue { background: #00a2ff; color: white; border: none; padding: 15px; border-radius: 8px; margin-top: 15px; font-weight: bold; width: 100%; cursor: pointer; }
        .music-card { background: #1c2128; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #00a2ff; }
        .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 10px; }
        .card-body { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #30363d; }
        .edit-area { width: 100%; height: 150px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; padding: 10px; margin-bottom: 10px; resize: none; }
        #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; }
        .msg.ia { background: #161b22; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #30363d; white-space: pre-wrap; }
        .msg.user { background: #00a2ff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-input-area { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #30363d; background: #0d1117; }
        .chat-input-area input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 25px; padding: 12px 20px; color: white; outline: none; }
        .btn-send { background: #00a2ff; border: none; width: 45px; height: 45px; border-radius: 50%; color: white; cursor: pointer; }
        #custom-toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #00a2ff; padding: 12px 25px; border-radius: 50px; font-weight: bold; z-index: 2000; }
    </style>
</head>
<body>

    <div id="custom-toast"></div>

    <nav class="navbar">
        <div class="nav-item active" id="nav-compor" onclick="openTab('compor')"><span>📝</span><span>Compor</span></div>
        <div class="nav-item" id="nav-biblioteca" onclick="openTab('biblioteca')"><span>📂</span><span>Músicas</span></div>
        <div class="nav-item" id="nav-ia" onclick="openTab('ia')"><span>⚡</span><span>Keime Studio</span></div>
    </nav>

    <div class="content">
        <div id="compor" class="tab-content active">
            <h1>Novo Hit</h1>
            <textarea id="texto-letra" placeholder="Finalize sua letra aqui..."></textarea>
            <button class="btn-blue" onclick="salvarNaBiblioteca()">SALVAR NA BIBLIOTECA</button>
        </div>

        <div id="biblioteca" class="tab-content">
            <h1>Minhas Pastas</h1>
            <div id="lista-musicas"></div>
        </div>

        <div id="ia" class="tab-content">
            <div id="chat-container">
                <div class="msg ia">Salve! Sou o Keime. 🎧\n\nQuer criar um hit novo do zero ou precisa de uma mão pra arrumar alguma letra?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Fala com o Keime..." onkeypress="if(event.key==='Enter')enviarMensagem()">
                <button class="btn-send" onclick="enviarMensagem()">➔</button>
            </div>
        </div>
    </div>

    <script>
        let etapaChat = 0;
        let modoEdicao = false;
        let dadosMusica = { estilo: "", tema: "", detalhes: "" };

        const keimeDialetos = {
            gratidao: ["Tamo junto! É nois que voa. 👊", "Valeu pela moral, meu mano! 🚀", "Fico felizão que tá curtindo o trampo! ✨", "É o bonde! Vamos fazer história. 🔥"],
            entendido: ["Visão captada!", "Aulas, entendi a fita.", "Pode crer, tô na mesma frequência.", "Anotado! O plano tá ficando brabo."],
            revisao: ["Bora lapidar esse diamante. O que não tá batendo?", "Manda a letra! O produtor nunca para até estar perfeito.", "Sou todo ouvidos. Qual parte a gente vai mudar?", "Pode falar, onde a gente vai mexer?"]
        };

        function escolher(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            if(tabId === 'biblioteca') renderizarBiblioteca();
        }

        function mostrarToast(msg) {
            const t = document.getElementById('custom-toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            const msgUser = input.value.trim();
            if(!msgUser) return;

            const uDiv = document.createElement('div'); uDiv.className = 'msg user'; uDiv.innerText = msgUser;
            container.appendChild(uDiv); 
            input.value = "";
            container.scrollTop = container.scrollHeight;
            
            setTimeout(() => {
                const iDiv = document.createElement('div'); iDiv.className = 'msg ia';
                let resposta = "";
                const texto = msgUser.toLowerCase();

                // 1. LÓGICA DE LOCALIZAÇÃO (Onde arrumar?)
                const termosRevisao = ["arrumar", "ajeitar", "mudar", "corrigir", "melhorar", "muda", "ajeita", "troca"];
                const partesMusica = ["refrão", "refrao", "verso", "ponte", "intro", "final", "começo", "letra"];
                
                const querRevisar = termosRevisao.some(p => texto.includes(p));
                const parteEspecifica = partesMusica.find(p => texto.includes(p));

                if(querRevisar || modoEdicao) {
                    modoEdicao = true;
                    etapaChat = -1; 

                    if (parteEspecifica) {
                        resposta = `Visão total! Bora mexer nesse **${parteEspecifica}**. O que você sentiu que não encaixou? Manda a ideia ou deixa que eu sugiro algo pesado.`;
                    } else if (texto.match(/(tá ruim|não gostei|muda tudo|melhora)/)) {
                        resposta = "Sem crise! No estúdio é assim mesmo, a gente vai lapidando até ficar nota 10. O que você quer mudar primeiro?";
                    } else if (texto.length > 15) {
                        resposta = "Saquei o ajuste! Se liga nessa visão que eu tive pra esse trecho:\n\n\"" + msgUser + " (Versão Keime Studio)\"\n\nFicou mais pesado assim ou quer tentar outro caminho?";
                    } else {
                        resposta = escolher(keimeDialetos.revisao);
                    }

                    iDiv.innerText = resposta;
                    container.appendChild(iDiv);
                    container.scrollTop = container.scrollHeight;
                    return;
                }

                // 2. CHECAGEM DE ELOGIO
                const elogios = ["brabo", "top", "incrivel", "vlw", "obrigado", "legal", "dahora", "amei", "gostei"];
                const ehElogio = elogios.some(p => texto.includes(p));
                let grato = ehElogio ? escolher(keimeDialetos.gratidao) + "\n\n" : "";

                // 3. FLUXO NORMAL (ENTREVISTA)
                if (etapaChat === 0) {
                    dadosMusica.estilo = msgUser;
                    resposta = grato + escolher(keimeDialetos.entendido) + " O estilo é " + dadosMusica.estilo + ". 🎧\n\nQual a HISTÓRIA por trás dessa música?";
                    etapaChat = 1;
                } else if (etapaChat === 1) {
                    dadosMusica.tema = msgUser;
                    resposta = grato + "Visão captada. ✍️\n\nÚltima pergunta: É pra AGITAR a pista ou algo mais PROFUNDO?";
                    etapaChat = 2;
                } else if (etapaChat === 2) {
                    dadosMusica.detalhes = msgUser;
                    resposta = "Aulas! Vou processar tudo e soltar o hit... 🚀";
                    iDiv.innerText = resposta;
                    container.appendChild(iDiv);
                    setTimeout(() => {
                        const hitDiv = document.createElement('div'); hitDiv.className = 'msg ia';
                        hitDiv.innerText = "AQUI ESTÁ O RASCUNHO (" + dadosMusica.estilo.toUpperCase() + "):\n\n" + gerarLetraDinamica(dadosMusica) + "\n\nSe quiser arrumar o refrão ou algum verso, só me dar o salve!";
                        container.appendChild(hitDiv);
                        container.scrollTop = container.scrollHeight;
                        etapaChat = 0; 
                    }, 2000);
                    return;
                } else {
                    resposta = grato + "Manda a visão! Quer criar algo novo ou mexer em algum projeto?";
                }

                iDiv.innerText = resposta;
                container.appendChild(iDiv); 
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }

        function gerarLetraDinamica(dados) {
            return "(Refrão)\nO tempo voa e eu não fico parado\nConstruindo o futuro, honrando o passado\n\n(Verso)\nMinha caneta é o pincel do destino\nFaço a trilha do meu próprio caminho.";
        }

        function salvarNaBiblioteca() {
            const campo = document.getElementById('texto-letra');
            if (!campo.value.trim()) return;
            let musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];
            musicas.unshift({ id: Date.now(), titulo: campo.value.split('\n')[0].substring(0, 20), letra: campo.value, data: new Date().toLocaleDateString('pt-BR') });
            localStorage.setItem('conquistador_musicas', JSON.stringify(musicas));
            campo.value = ""; mostrarToast("Hit Salvo! 🔥");
        }

        function renderizarBiblioteca() {
            const container = document.getElementById('lista-musicas');
            const musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];
            container.innerHTML = musicas.length ? "" : '<p style="text-align:center;color:#8b949e;">Biblioteca Vazia...</p>';
            musicas.forEach(m => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `<div class="card-header" onclick="toggleCard(this.parentElement)"><span>${m.titulo}</span><small>${m.data}</small></div>
                <div class="card-body"><textarea class="edit-area" id="edit-${m.id}">${m.letra}</textarea><button class="btn-blue" onclick="atualizarMusica(${m.id})">ATUALIZAR</button></div>`;
                container.appendChild(card);
            });
        }

        function toggleCard(card) {
            const body = card.querySelector('.card-body');
            body.style.display = body.style.display === 'block' ? 'none' : 'block';
        }

        function atualizarMusica(id) {
            let musicas = JSON.parse(localStorage.getItem('conquistador_musicas'));
            const idx = musicas.findIndex(m => m.id === id);
            musicas[idx].letra = document.getElementById(`edit-${id}`).value;
            localStorage.setItem('conquistador_musicas', JSON.stringify(musicas));
            mostrarToast("Atualizado! 📝");
        }
    </script>
</body>
</html>
