<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistador Studio | Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            background-color: #161b22;
            border-bottom: 2px solid #00a2ff;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-item {
            color: #8b949e;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-item:hover, .nav-item.active { color: #00a2ff; }

        /* Conteúdo */
        .content { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .tab-content { display: none; width: 100%; max-width: 600px; }
        .tab-content.active { display: block; }

        h1 { font-size: 1.5rem; margin-bottom: 15px; text-align: center; }

        textarea {
            width: 100%; height: 350px; background: #161b22; border: 1px solid #30363d;
            border-radius: 12px; color: white; padding: 15px; font-size: 1rem; resize: none; outline: none;
        }
        textarea:focus { border-color: #00a2ff; }

        .btn-blue {
            background: #00a2ff; color: white; border: none; padding: 15px;
            border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem;
        }

        /* Cards da Biblioteca */
        .music-card {
            background: #1c2128; padding: 15px; border-radius: 8px; margin-bottom: 10px;
            border-left: 4px solid #00a2ff;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .header-info { display: flex; align-items: center; gap: 10px; }

        .btn-delete {
            background: transparent; color: #f85149; border: none; cursor: pointer;
            font-size: 1.1rem; padding: 5px;
        }

        .card-body { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #30363d; }

        .edit-area {
            width: 100%; height: 200px; background: #0d1117; border: 1px solid #30363d;
            border-radius: 8px; color: #c9d1d9; padding: 10px; font-size: 0.9rem; resize: none; outline: none;
            margin-bottom: 10px;
        }

        .btn-group { display: flex; gap: 10px; }
        .btn-save-edit { background: #00a2ff; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; flex: 1; font-weight: bold; }
        .btn-copy { background: #238636; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; flex: 1; font-weight: bold; }

        /* AVISOS E MODAIS CUSTOMIZADOS */
        #custom-toast {
            display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #00a2ff; color: white; padding: 12px 25px; border-radius: 50px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 2000;
            animation: slideDown 0.3s ease-out;
        }

        #custom-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center;
        }

        .modal-box {
            background: #1c2128; padding: 25px; border-radius: 15px; border: 1px solid #30363d;
            width: 90%; max-width: 400px; text-align: center;
        }

        .modal-box p { margin-bottom: 20px; font-size: 1.1rem; }
        .modal-buttons { display: flex; gap: 10px; }
        .btn-modal { padding: 12px; border-radius: 8px; border: none; cursor: pointer; flex: 1; font-weight: bold; }
        .btn-cancel { background: #30363d; color: white; }
        .btn-confirm { background: #f85149; color: white; }

        @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }

    </style>
</head>
<body>

    <div id="custom-toast"></div>

    <div id="custom-modal-overlay">
        <div class="modal-box">
            <p id="modal-text">Deseja realmente fazer isso?</p>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="fecharModal()">CANCELAR</button>
                <button class="btn-modal btn-confirm" id="confirm-action">EXCLUIR</button>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-item active" id="nav-compor" onclick="openTab('compor')">
            <span>📝</span><span>Compor</span>
        </div>
        <div class="nav-item" id="nav-biblioteca" onclick="openTab('biblioteca')">
            <span>📂</span><span>Músicas</span>
        </div>
        <div class="nav-item" id="nav-ia" onclick="openTab('ia')">
            <span>⚡</span><span>Produção IA</span>
        </div>
    </nav>

    <div class="content">
        <div id="compor" class="tab-content active">
            <h1>Novo Hit</h1>
            <textarea id="texto-letra" placeholder="Escreva sua letra aqui..."></textarea>
            <button class="btn-blue" onclick="salvarNaBiblioteca()">SALVAR NA BIBLIOTECA</button>
        </div>

        <div id="biblioteca" class="tab-content">
            <h1>Minhas Pastas</h1>
            <div id="lista-musicas"></div>
        </div>

        <div id="ia" class="tab-content">
            <h1>Criação com IA</h1>
            <p style="text-align: center; color: #8b949e; margin-top: 20px;">Em breve: A IA vai ler sua letra e sugerir o melhor estilo musical.</p>
        </div>
    </div>

    <script>
        let musicIdParaDeletar = null;

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            if(tabId === 'biblioteca') renderizarBiblioteca();
        }

        function mostrarToast(msg) {
            const toast = document.getElementById('custom-toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        function abrirModal(id) {
            musicIdParaDeletar = id;
            document.getElementById('custom-modal-overlay').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('custom-modal-overlay').style.display = 'none';
            musicIdParaDeletar = null;
        }

        document.getElementById('confirm-action').onclick = function() {
            if(musicIdParaDeletar) {
                let musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];
                musicas = musicas.filter(m => m.id !== musicIdParaDeletar);
                localStorage.setItem('conquistador_musicas', JSON.stringify(musicas));
                fecharModal();
                mostrarToast("Música excluída! 🗑️");
                renderizarBiblioteca();
            }
        };

        function salvarNaBiblioteca() {
            const campo = document.getElementById('texto-letra');
            if (!campo.value.trim()) return;
            const musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];
            const nova = {
                id: Date.now(),
                titulo: campo.value.split('\n')[0].substring(0, 20) || "Sem título",
                letra: campo.value,
                data: new Date().toLocaleDateString('pt-BR')
            };
            musicas.unshift(nova);
            localStorage.setItem('conquistador_musicas', JSON.stringify(musicas));
            campo.value = "";
            mostrarToast("Música salva com sucesso! 🔥");
        }

        function renderizarBiblioteca() {
            const container = document.getElementById('lista-musicas');
            const musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];
            container.innerHTML = musicas.length ? "" : '<p style="text-align:center;color:#8b949e;">Nenhuma música salva.</p>';

            musicas.forEach(m => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span onclick="toggleCard(this.parentElement.parentElement)">${m.titulo}</span>
                        <div class="header-info">
                            <small>${m.data}</small>
                            <button class="btn-delete" onclick="abrirModal(${m.id})">🗑️</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <textarea class="edit-area" id="edit-${m.id}">${m.letra}</textarea>
                        <div class="btn-group">
                            <button class="btn-save-edit" onclick="atualizarMusica(${m.id})">SALVAR</button>
                            <button class="btn-copy" onclick="copiarLetra(${m.id})">COPIAR</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleCard(card) {
            const body = card.querySelector('.card-body');
            const isOpen = body.style.display === 'block';
            document.querySelectorAll('.card-body').forEach(b => b.style.display = 'none');
            body.style.display = isOpen ? 'none' : 'block';
        }

        function atualizarMusica(id) {
            const novaLetra = document.getElementById(`edit-${id}`).value;
            let musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];
            const idx = musicas.findIndex(m => m.id === id);
            if (idx !== -1) {
                musicas[idx].letra = novaLetra;
                musicas[idx].titulo = novaLetra.split('\n')[0].substring(0, 20);
                localStorage.setItem('conquistador_musicas', JSON.stringify(musicas));
                mostrarToast("Alterações salvas! 📝");
                renderizarBiblioteca();
            }
        }

        function copiarLetra(id) {
            const texto = document.getElementById(`edit-${id}`).value;
            navigator.clipboard.writeText(texto);
            mostrarToast("Copiado! 📋");
        }
    </script>
</body>
</html>
