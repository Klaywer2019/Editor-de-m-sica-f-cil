<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistador Studio | AI Partner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Navbar */
        .navbar {
            background-color: #161b22;
            border-bottom: 2px solid #00a2ff;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            z-index: 100;
        }

        .nav-item {
            color: #8b949e;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-item.active { color: #00a2ff; }

        /* Conteúdo */
        .content { flex: 1; position: relative; display: flex; flex-direction: column; }

        .tab-content { 
            display: none; 
            width: 100%; 
            height: 100%;
            padding: 20px;
            flex-direction: column;
        }
        .tab-content.active { display: flex; }

        /* Chat IA */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 80px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg.ia {
            background: #161b22;
            color: #c9d1d9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #30363d;
        }

        .msg.user {
            background: #00a2ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: #0d1117;
            display: flex;
            gap: 10px;
            border-top: 1px solid #30363d;
        }

        .chat-input-area input {
            flex: 1;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 25px;
            padding: 12px 20px;
            color: white;
            outline: none;
        }

        .btn-send {
            background: #00a2ff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Outras Abas */
        textarea {
            width: 100%; height: 60%; background: #161b22; border: 1px solid #30363d;
            border-radius: 12px; color: white; padding: 15px; font-size: 1rem; resize: none;
        }

        .btn-blue {
            background: #00a2ff; color: white; border: none; padding: 15px;
            border-radius: 8px; margin-top: 15px; font-weight: bold; width: 100%;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-item" id="nav-compor" onclick="openTab('compor')">
            <span>📝</span><span>Compor</span>
        </div>
        <div class="nav-item" id="nav-biblioteca" onclick="openTab('biblioteca')">
            <span>📂</span><span>Músicas</span>
        </div>
        <div class="nav-item active" id="nav-ia" onclick="openTab('ia')">
            <span>⚡</span><span>Produção IA</span>
        </div>
    </nav>

    <div class="content">
        <div id="compor" class="tab-content">
            <h1 style="text-align: center; margin-bottom: 15px;">Novo Hit</h1>
            <textarea id="texto-letra" placeholder="Manda a letra..."></textarea>
            <button class="btn-blue" onclick="salvarNaBiblioteca()">SALVAR HIT</button>
        </div>

        <div id="biblioteca" class="tab-content">
            <h1 style="text-align: center; margin-bottom: 15px;">Minhas Pastas</h1>
            <div id="lista-musicas"></div>
        </div>

        <div id="ia" class="tab-content active">
            <div id="chat-container">
                <div class="msg ia">Salve, meu mano! Sou seu parceiro de estúdio. Qual a vibe do hit de hoje? Pode mandar a letra ou só a ideia que a gente desenrola! 🚀</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Troca uma ideia com a IA..." onkeypress="checkEnter(event)">
                <button class="btn-send" onclick="enviarMensagem()">➔</button>
            </div>
        </div>
    </div>

    <script>
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        function checkEnter(e) { if(e.key === 'Enter') enviarMensagem(); }

        function escolher(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

        function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            const textoUser = input.value.trim().toLowerCase();
            
            if(!textoUser) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.innerText = input.value;
            container.appendChild(userMsg);
            input.value = "";
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const iaMsg = document.createElement('div');
                iaMsg.className = 'msg ia';
                
                // Personalidade Humana e Alegre
                const saudar = ["Boa!", "Curti a visão!", "Eita, essa vai ser hit!", "Vibe pesada, hein?", "Tô sentindo a energia daqui! 🔥"];
                const incentivar = ["Pode deixar comigo, tô pronto pra transformar isso em música.", "Dá pra sentir o feeling daqui, vamos pra cima!", "Sou teu braço direito nessa produção, mano."];
                
                let resposta = "";

                if(textoUser.includes("calmo") || textoUser.includes("suave")) {
                    resposta = "Uma pegada mais relax? Entendi perfeitamente. 🌊 " + escolher(incentivar) + " Prefere um violão de fundo ou algo mais sintetizado?";
                } else if(textoUser.includes("agressivo") || textoUser.includes("grave") || textoUser.includes("trap")) {
                    resposta = "Aulas! O grave vai tremer tudo. 🔥 " + escolher(incentivar) + " Quer um BPM mais acelerado ou aquele slow mais arrastado?";
                } else {
                    resposta = escolher(saudar) + " " + escolher(incentivar) + " O que mais você imagina pra essa faixa?";
                }

                iaMsg.innerText = resposta;
                container.appendChild(iaMsg);
                container.scrollTop = container.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
