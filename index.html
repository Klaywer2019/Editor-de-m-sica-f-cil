<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conquistador Studio | Keime Producer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0d1117; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden; 
        }

        .navbar { background-color: #161b22; border-bottom: 2px solid #00a2ff; display: flex; justify-content: space-around; padding: 15px 0; z-index: 100; flex-shrink: 0; }
        .nav-item { color: #8b949e; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item.active { color: #00a2ff; }
        
        .content { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        .tab-content { display: none; width: 100%; height: 100%; padding: 20px; flex-direction: column; overflow-y: auto; }
        .tab-content.active { display: flex; }

        #ia.tab-content.active { display: flex; flex-direction: column; padding: 10px 20px; }

        h1 { font-size: 1.5rem; margin-bottom: 15px; text-align: center; }
        textarea#texto-letra { width: 100%; height: 300px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; color: white; padding: 15px; font-size: 1rem; resize: none; outline: none; }
        .btn-blue { background: #00a2ff; color: white; border: none; padding: 15px; border-radius: 8px; margin-top: 15px; font-weight: bold; width: 100%; cursor: pointer; flex-shrink: 0; }
        
        .music-card { background: #1c2128; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #00a2ff; }
        .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 10px; }
        .card-body { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #30363d; }
        
        .card-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-action { flex: 1; padding: 12px 5px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; }
        .btn-copy { background: #30363d; color: white; }
        .btn-delete { background: #da3633; color: white; }
        .btn-update { background: #00a2ff; color: white; flex: 1.5; }

        .edit-area { width: 100%; height: 150px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; padding: 10px; margin-bottom: 10px; resize: none; }

        #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 10px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; }
        .msg.ia { background: #161b22; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #30363d; white-space: pre-wrap; }
        .msg.user { background: #00a2ff; align-self: flex-end; border-bottom-right-radius: 4px; }

        .chat-input-area { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #30363d; background: #0d1117; flex-shrink: 0; margin-bottom: 5px; }
        .chat-input-area input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 25px; padding: 12px 20px; color: white; outline: none; min-width: 0; }
        .btn-send { background: #00a2ff; border: none; width: 45px; height: 45px; border-radius: 50%; color: white; cursor: pointer; flex-shrink: 0; }
        
        #custom-toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #00a2ff; padding: 12px 25px; border-radius: 50px; font-weight: bold; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="custom-toast"></div>

    <nav class="navbar">
        <div class="nav-item active" id="nav-compor" onclick="openTab('compor')"><span>📝</span><span>Compor</span></div>
        <div class="nav-item" id="nav-biblioteca" onclick="openTab('biblioteca')"><span>📂</span><span>Músicas</span></div>
        <div class="nav-item" id="nav-ia" onclick="openTab('ia')"><span>⚡</span><span>Keime Studio</span></div>
    </nav>

    <div class="content">
        <div id="compor" class="tab-content active">
            <h1>Novo Hit</h1>
            <textarea id="texto-letra" placeholder="Finalize sua letra aqui..."></textarea>
            <button class="btn-blue" onclick="salvarNaBiblioteca()">SALVAR NA BIBLIOTECA</button>
        </div>

        <div id="biblioteca" class="tab-content">
            <h1>Minhas Pastas</h1>
            <div id="lista-musicas"></div>
        </div>

        <div id="ia" class="tab-content">
            <div id="chat-container">
                <div class="msg ia">Salve! Sou o Keime. 🎧\n\nQual a vibe de hoje? Vamos criar um som único do zero ou lapidar um rascunho?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Fala com o Keime..." onkeypress="if(event.key==='Enter')enviarMensagem()">
                <button class="btn-send" onclick="enviarMensagem()">➔</button>
            </div>
        </div>
    </div>

<script src="keime-data.js"></script>

    <script>
        let etapaChat = 0;
        let modoEdicao = false;
        let dadosMusica = { estilo: "", tema: "", detalhes: "" };

        const keimeDialetos = {
            gratidao: ["Tamo junto! É nois que voa. 👊", "Valeu pela moral, meu mano! 🚀", "Fico felizão que tá curtindo o trampo! ✨", "É o bonde! Vamos fazer história. 🔥"],
            entendido: ["Visão captada!", "Aulas, entendi a fita.", "Pode crer, tô na mesma frequência.", "Anotado! O plano tá ficando brabo."],
            revisao: ["Bora lapidar esse diamante. O que não tá batendo?", "Manda a letra! O produtor nunca para até estar perfeito.", "Sou todo ouvidos. Qual parte a gente vai mudar?", "Pode falar, onde a gente vai mexer?"]
        };

        const bancoCriativo = {
            rimasGerais: ["meu destino", "venci o perigo", "foco no objetivo", "sigo vivo", "mundo gira", "minha trilha", "família em primeiro", "dia inteiro"],
            estilos: {
                trap: ["Grave batendo no peito", "Visão de cria, sem erro", "Notas voando no vento", "Diamante lapidado no tempo"],
                funk: ["Baile tá lotado, fumaça pro alto", "As nota de cem contando no asfalto", "Passinho na régua, sem neurose", "Vencendo na vida, sem dar hipótese"],
                drill: ["Passo mascarado na noite escura", "Sobrevivente dessa selva de rua", "Gelo no pescoço, fogo na mente", "Minha banca domina, sigo na frente"],
                rnb: ["Na luz da lua a gente se entende", "Sentimento puro que a alma sente", "Notas suaves, flow envolvente", "Nossa sintonia é o que nos prende"]
            },
            vibes: {
                agitado: ["Energia lá no topo, ninguém segura", "Batida pesada, adrenalina pura", "Quebrando as regras, fazendo a história"],
                profundo: ["Cicatrizes que viraram medalhas", "Na luta constante, vencendo batalhas", "Pensamentos voam além do horizonte"]
            }
        };

        const dicionarioCriativo = {
            substitutos: {
                "trabalho": "corre", "sucesso": "topo", "dinheiro": "malote",
                "ajuda": "help", "verdade": "a real", "olha": "se liga",
                "consegui": "venci", "amigos": "meus manos", "legal": "da hora"
            }
        };

        function escolher(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

        function gerarHitUnico() {
            const estiloChave = dadosMusica.estilo.toLowerCase();
            let listaEstilo = bancoCriativo.estilos.trap;
            if(estiloChave.includes("funk")) listaEstilo = bancoCriativo.estilos.funk;
            else if(estiloChave.includes("drill")) listaEstilo = bancoCriativo.estilos.drill;
            else if(estiloChave.includes("r&b") || estiloChave.includes("suave")) listaEstilo = bancoCriativo.estilos.rnb;
            const viber = dadosMusica.detalhes.toLowerCase().includes("agitado") ? bancoCriativo.vibes.agitado : bancoCriativo.vibes.profundo;

            let hit = `(Refrão)\n${escolher(listaEstilo)}\n${dadosMusica.tema.substring(0, 30)}... eu sigo no jeito\n${escolher(bancoCriativo.rimasGerais)}\n${escolher(viber)}\n\n`;
            hit += `(Verso)\nMinha história é real, missão é o foco\n${escolher(bancoCriativo.rimasGerais)}\n${escolher(listaEstilo)}\nNão paro por nada, sigo no topo.`;
            return hit;
        }

        function lapidarLetra(textoBase) {
            let linhas = textoBase.split('\n').filter(l => l.trim() !== "");
            let resultado = "";
            linhas.forEach((linha, i) => {
                let novaLinha = linha;
                for (let [antigo, novo] of Object.entries(dicionarioCriativo.substitutos)) {
                    const regex = new RegExp(antigo, "gi");
                    novaLinha = novaLinha.replace(regex, novo);
                }
                resultado += novaLinha + "\n";
                if ((i + 1) % 4 === 0) resultado += "\n"; 
            });
            return resultado;
        }

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            if(tabId === 'biblioteca') renderizarBiblioteca();
            if(tabId === 'ia') {
                const container = document.getElementById('chat-container');
                container.scrollTop = container.scrollHeight;
            }
        }

        function mostrarToast(msg) {
            const t = document.getElementById('custom-toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            const msgUser = input.value.trim();
            if(!msgUser) return;

            const uDiv = document.createElement('div'); uDiv.className = 'msg user'; uDiv.innerText = msgUser;
            container.appendChild(uDiv); 
            input.value = "";
            container.scrollTop = container.scrollHeight;
            
            setTimeout(() => {
                const iDiv = document.createElement('div'); iDiv.className = 'msg ia';
                let resposta = "";
                const texto = msgUser.toLowerCase();

                // LOGICA DE INTENÇÃO (O "FREIO")
                const ehElogio = ["brabo", "top", "incrivel", "vlw", "obrigado", "legal", "dahora", "amei", "gostei"].some(p => texto.includes(p));
                const querEditar = ["arruma", "ajeita", "muda", "corrigir", "melhorar", "troca", "separar", "rima", "lapidar", "mexer", "aceitar"].some(t => texto.includes(t));
                const querNovo = ["novo", "outra", "do zero", "reiniciar"].some(n => texto.includes(n));

                if (querNovo) {
                    etapaChat = 0; modoEdicao = false;
                    resposta = "Pode crer! Estúdio limpo. 🎙️\n\nQual o estilo dessa nova pedrada?";
                } 
                else if (querEditar) {
                    modoEdicao = true;
                    resposta = escolher(keimeDialetos.revisao);
                }
                else if (ehElogio && etapaChat === 3) {
                    resposta = escolher(keimeDialetos.gratidao) + "\n\nO som tá no ponto ou quer que eu ajeite mais alguma rima?";
                }
                else if (etapaChat === 0) {
                    dadosMusica.estilo = msgUser;
                    resposta = escolher(keimeDialetos.entendido) + " Estilo " + dadosMusica.estilo + ". 🎧\n\nQual a HISTÓRIA por trás desse som?";
                    etapaChat = 1;
                } 
                else if (etapaChat === 1) {
                    dadosMusica.tema = msgUser;
                    resposta = "Visão captada. ✍️\n\nQuer um hit pra AGITAR ou algo mais PROFUNDO?";
                    etapaChat = 2;
                } 
                else if (etapaChat === 2) {
                    dadosMusica.detalhes = msgUser;
                    resposta = "Deixa comigo, tô sentindo a vibe... 🚀 Gerando uma composição única...";
                    iDiv.innerText = resposta;
                    container.appendChild(iDiv);
                    
                    setTimeout(() => {
                        const hitDiv = document.createElement('div'); hitDiv.className = 'msg ia';
                        hitDiv.innerText = "AQUI ESTÁ SEU HIT EXCLUSIVO:\n\n" + gerarHitUnico();
                        container.appendChild(hitDiv);
                        container.scrollTop = container.scrollHeight;
                        etapaChat = 3; 
                    }, 2000);
                    return;
                } 
                else {
                    resposta = "Tô na escuta! Quer mexer na letra ou o plano é outro?";
                }

                iDiv.innerText = resposta;
                container.appendChild(iDiv); 
                container.scrollTop = container.scrollHeight;
            }, 1500); 
        }

        function salvarNaBiblioteca() {
            const campo = document.getElementById('texto-letra');
            if (!campo.value.trim()) return;
            let musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];
            musicas.unshift({ id: Date.now(), titulo: campo.value.split('\n')[0].substring(0, 20), letra: campo.value, data: new Date().toLocaleDateString('pt-BR') });
            localStorage.setItem('conquistador_musicas', JSON.stringify(musicas));
            campo.value = ""; mostrarToast("Hit Salvo! 🔥");
        }

        function renderizarBiblioteca() {
            const container = document.getElementById('lista-musicas');
            const musicas = JSON.parse(localStorage.getItem('conquistador_musicas')) || [];
            container.innerHTML = musicas.length ? "" : '<p style="text-align:center;color:#8b949e;margin-top:20px;">Biblioteca Vazia...</p>';
            musicas.forEach(m => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `
                    <div class="card-header" onclick="toggleCard(this.parentElement)">
                        <span>${m.titulo}</span>
                        <small>${m.data}</small>
                    </div>
                    <div class="card-body">
                        <textarea class="edit-area" id="edit-${m.id}">${m.letra}</textarea>
                        <div class="card-actions">
                            <button class="btn-action btn-copy" onclick="copiarMusica('${m.id}')">COPIAR</button>
                            <button class="btn-action btn-delete" onclick="excluirMusica(${m.id})">EXCLUIR</button>
                            <button class="btn-action btn-update" onclick="atualizarMusica(${m.id})">SALVAR</button>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        }

        function toggleCard(card) {
            const body = card.querySelector('.card-body');
            body.style.display = body.style.display === 'block' ? 'none' : 'block';
        }

        function atualizarMusica(id) {
            let musicas = JSON.parse(localStorage.getItem('conquistador_musicas'));
            const idx = musicas.findIndex(m => m.id === id);
            musicas[idx].letra = document.getElementById(`edit-${id}`).value;
            localStorage.setItem('conquistador_musicas', JSON.stringify(musicas));
            mostrarToast("Alterações salvas! 📝");
        }

        function excluirMusica(id) {
            if(!confirm("Deseja apagar essa pasta?")) return;
            let musicas = JSON.parse(localStorage.getItem('conquistador_musicas'));
            musicas = musicas.filter(m => m.id !== id);
            localStorage.setItem('conquistador_musicas', JSON.stringify(musicas));
            renderizarBiblioteca();
            mostrarToast("Pasta excluída! 🗑️");
        }

        function copiarMusica(id) {
            const texto = document.getElementById(`edit-${id}`).value;
            navigator.clipboard.writeText(texto).then(() => {
                mostrarToast("Letra copiada! 📋");
            }).catch(() => {
                mostrarToast("Erro ao copiar...");
            });
        }
    </script>
<script src="conhecimento.js"></script>
</body>
</html>
